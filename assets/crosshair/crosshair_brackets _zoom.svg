<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="color:#000000;">
  <g>
    <!-- Made the square corners slightly smaller by moving them inward -->
    <polyline points="28,42 28,28 42,28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="72,42 72,28 58,28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="28,58 28,72 42,72" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="72,58 72,72 58,72" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Made the cross in the middle slightly bigger by extending the lines -->
    <line x1="42" y1="50" x2="58" y2="50" stroke="#ff0000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="42" x2="50" y2="58" stroke="#ff0000" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="2" fill="#ff0000"/>
  </g>
</svg>
